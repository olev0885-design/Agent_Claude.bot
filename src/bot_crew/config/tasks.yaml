# =============================================================================
# tasks.yaml — ДЕКЛАРАТИВНОЕ ОПИСАНИЕ ЗАДАЧ (Task) команды CrewAI.
# =============================================================================
# Каждая задача привязывается к конкретному агенту (см. crew.py, поле
# "agent" в декораторе @task). Задачи выполняются ПОСЛЕДОВАТЕЛЬНО
# (Process.sequential), то есть execute_trade_task получит на вход
# результат parse_signal_task через механизм "context" в CrewAI.
#
# Обязательные поля:
#   description    — подробное описание того, что нужно сделать
#                    (поддерживает подстановку переменных через {var})
#   expected_output — описание ожидаемого формата результата
#                    (критически важно для получения строгого JSON)
# =============================================================================

# -----------------------------------------------------------------------------
# ЗАДАЧА №1: parse_signal_task — распарсить сырой текст сигнала
# -----------------------------------------------------------------------------
parse_signal_task:
  description: >
    Проанализируй следующий сырой текст сообщения из Telegram-канала
    с арбитражными Spread-сигналами:

    "{raw_signal_text}"

    Это сообщение вида "#COIN | Spread: X%" со строками Short/Long по
    двум биржам (см. пример реального формата в твоей backstory). Извлеки
    из него:
      1. coin           — чистый тикер монеты из скобок "(COPY: `...`)",
                           без суффикса "_USDT" (например, "TAC", "PURR").
      2. short_exchange  — название биржи из строки "Short ..." (в нижнем
                            регистре, например "ourbit").
      3. short_price     — цена из той же строки "Short ..." (число).
      4. long_exchange   — название биржи из строки "Long ..." (в нижнем
                            регистре, например "bybit").
      5. long_price      — цена из той же строки "Long ..." (число).
      6. spread_percent  — число из "| Spread: X%" (без знака %).

    Используй регулярные выражения (RegEx). Если текст НЕ является
    Spread-сигналом такого вида (например, это сообщение "aligned in
    MM:SS" или любое другое) — верни все поля как null, ничего не
    придумывая. Если конкретное поле невозможно извлечь — тоже верни
    для него null.

  expected_output: >
    Строго валидный JSON-объект (без markdown-разметки, без пояснений
    "до" и "после") со следующими ключами:
    {"coin": "TAC", "short_exchange": "ourbit", "short_price": 0.005083,
    "long_exchange": "bybit", "long_price": 0.00492, "spread_percent": 3.31}

# -----------------------------------------------------------------------------
# ЗАДАЧА №2: execute_trade_task — исполнить сделку на биржах
# -----------------------------------------------------------------------------
execute_trade_task:
  description: >
    Используя JSON-результат предыдущей задачи (parse_signal_task) как
    источник параметров сделки, выполни следующее:

      1. Проверь, что "coin", "long_exchange" и "short_exchange" не равны
         null (это значит, что распарсенное сообщение не было валидным
         Spread-сигналом) — если хотя бы одно из них null, НЕ открывай
         сделку, а верни отчёт с причиной отказа ("сообщение не является
         Spread-сигналом").
      2. Если все три поля заполнены — вызови инструмент trade_tool
         (Trade Execution Tool) с параметрами:
           - coin (монета из JSON)
           - long_exchange (биржа для LONG из JSON)
           - short_exchange (биржа для SHORT из JSON)
         Инструмент сам асинхронно откроет обе ноги сделки одновременно.
         Trade Execution Tool сам решает, какую именно биржу использовать
         для Long, а какую — для Short, на основе значений long_exchange
         и short_exchange из JSON — не путай их местами.
      3. Сформируй итоговый отчёт с результатами обеих сделок: статус
         (успех/ошибка/биржа не поддерживается), ID ордеров, цену
         исполнения на каждой бирже, и фактическую задержку между
         открытием двух ног (в миллисекундах). Если какая-то нога вернула
         статус "EXCHANGE_NOT_SUPPORTED" — честно укажи в отчёте, что
         сделка по этой ноге не была открыта, т.к. биржа не поддерживается.

  expected_output: >
    Человеко-читаемый текстовый отчёт (2-5 предложений) о результате
    исполнения сделки: какая монета, на каких биржах, по какой цене,
    с какой задержкой между ногами спреда, либо причина отказа от сделки.

  # context — список задач, результаты которых нужны этой задаче как вход.
  # CrewAI автоматически передаёт "output" задачи parse_signal_task
  # в качестве дополнительного контекста для execute_trade_task.
  context:
    - parse_signal_task
