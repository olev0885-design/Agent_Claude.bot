# =============================================================================
# pyproject.toml — минимальная конфигурация сборки пакета.
# =============================================================================
# Нужен для того, чтобы папка src/bot_crew стала импортируемой как пакет
# "bot_crew" (без префикса "src."). Устанавливается командой:
#   pip install -e .
# Флаг -e (editable) означает, что пакет "ссылается" на исходники в src/,
# а не копируется — любое изменение кода сразу видно без переустановки.
# =============================================================================

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bot_crew"
version = "0.1.0"
description = "CrewAI-бот для арбитража фьючерсных спредов на основе Telegram-сигналов"
requires-python = ">=3.10"

# --- Настройка setuptools: где искать пакет ---------------------------------
[tool.setuptools.packages.find]
# Ищем пакеты внутри папки src/ (а не в корне проекта).
where = ["src"]

[tool.setuptools.package-dir]
# Сопоставляем "корень пакетов" с папкой src/, поэтому
# src/bot_crew становится импортируемым как просто "bot_crew".
"" = "src"
